name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Installs all XCB/EGL/GL/X11 libraries required by Qt6/PySide6 on Linux,
      # and starts a virtual display (Xvfb) so the xcb platform plugin works.
      # This action is the standard solution used across the scientific Python Qt
      # ecosystem (napari, pymmcore-plus, etc.) for headless CI on ubuntu-latest.
      - name: Set up Qt display libs (Linux)
        if: runner.os == 'Linux'
        uses: tlambert03/setup-qt-libs@v1

      - name: Install extra font packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fonts-dejavu-core fontconfig

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint Check
        continue-on-error: true
        run: |
          ruff check .

      - name: Run Test Suite (Linux)
        if: runner.os == 'Linux'
        env:
          DISPLAY: ":1"
          QT_QPA_PLATFORM: xcb
          PYQTGRAPH_QT_LIB: PySide6
          QT_QPA_FONTDIR: /usr/share/fonts/truetype/dejavu
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          pytest -v

      - name: Run Test Suite (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          PYQTGRAPH_QT_LIB: PySide6
        run: |
          pytest -v
